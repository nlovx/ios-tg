name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-v1-${{ github.run_id }}
          restore-keys: |
            bazel-v1-

      - name: Build the app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"

          # same config as the official one, but with our own api_id / api_hash
          python3 - <<'PY'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["api_id"] = os.environ["TG_API_ID"].strip()
          c["api_hash"] = os.environ["TG_API_HASH"].strip()
          json.dump(c, open("build-system/my-configuration.json", "w"), indent=1)
          PY

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build \
            --continueOnError \
            --configurationPath="build-system/my-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" build/artifacts/
          done
          ls -la build/artifacts

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-v1-${{ github.run_id }}

      # the repo is public and the ipa contains the api_hash, so the artifact is password-protected
      - name: Encrypt IPA
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          cd /Users/Shared/telegram-ios/build/artifacts
          zip -P "$ZIP_PASS" Telegram-ipa.zip Telegram.ipa
          rm Telegram.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram-ipa.zip
          retention-days: 7
